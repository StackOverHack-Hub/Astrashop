name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Lambda runtime
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://example.execute-api.ap-south-1.amazonaws.com
          VITE_MARKETPLACE_API_URL: https://market-api.example.com
          VITE_MARKETPLACE_LOGIN_ORIGIN: https://market-login.example.com
          VITE_MARKETPLACE_CLIENT_ID: ci-example-client
      - run: npm test

  marketplace-services:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports: ['8000:8000']
      redis:
        image: redis:7.2.12-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 2s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/marketplace.integration.test.mjs test/shop.integration.test.mjs
        env:
          MARKETPLACE_DYNAMO_ENDPOINT: http://127.0.0.1:8000
          MARKETPLACE_REDIS_URL: redis://127.0.0.1:6379

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The SAM translator lets cfn-lint expand and check the Serverless resources.
      - run: pip install cfn-lint==1.61.0 aws-sam-translator==1.118.0
      - run: cfn-lint backend/template.yaml backend/marketplace-template.yaml

  container-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test Docker startup, concurrent exchanges, outages, and recovery
        run: ./scripts/stress-local.sh
        env:
          BUILDKIT_PROGRESS: plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-container-test-reports
          path: artifacts/*.json
