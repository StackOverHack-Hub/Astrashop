AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AstraShop campus marketplace
Parameters:
  FrontendOrigin:
    Type: String
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
    Description: The canonical HTTPS frontend origin without a trailing slash.
  CampusEmailDomain:
    Type: String
    Default: adypu.edu.in
    AllowedPattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$'
    Description: Exact campus email suffix without the @ character.
  ResourcePrefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,23}$'
    Description: A unique short lowercase prefix for the Cognito domain and ElastiCache.
  ThrottleRate:
    Type: Number
    Default: 35
    MinValue: 5
    MaxValue: 200
  ThrottleBurst:
    Type: Number
    Default: 70
    MinValue: 10
    MaxValue: 400

Resources:
  MarketplaceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }

  MarketplaceVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/24
      EnableDnsHostnames: true
      EnableDnsSupport: true
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MarketplaceVpc
      CidrBlock: 10.77.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MarketplaceVpc
      CidrBlock: 10.77.0.64/26
      AvailabilityZone: !Select [1, !GetAZs '']
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MarketplaceVpc
  PrivateRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateA
      RouteTableId: !Ref PrivateRoutes
  PrivateRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateB
      RouteTableId: !Ref PrivateRoutes
  DynamoEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MarketplaceVpc
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      RouteTableIds: [!Ref PrivateRoutes]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: [dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
            Resource: !GetAtt MarketplaceTable.Arn
  LambdaNetwork:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Marketplace Lambda in private subnets without an internet route
      VpcId: !Ref MarketplaceVpc
  CacheNetwork:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis TLS from the marketplace Lambda
      VpcId: !Ref MarketplaceVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6380, SourceSecurityGroupId: !Ref LambdaNetwork }

  RedisSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
  RedisUser:
    Type: AWS::ElastiCache::User
    Properties:
      Engine: redis
      UserId: !Sub '${ResourcePrefix}-limiter'
      UserName: default
      AccessString: 'on ~astrashop:marketplace:* +@connection +cluster|slots +cluster|shards +asking +eval +time +hmget +hset +pexpire'
      AuthenticationMode:
        Type: password
        Passwords: [!Sub '{{resolve:secretsmanager:${RedisSecret}:SecretString:password}}']
  RedisUsers:
    Type: AWS::ElastiCache::UserGroup
    Properties:
      Engine: redis
      UserGroupId: !Sub '${ResourcePrefix}-limiters'
      UserIds: [!Ref RedisUser]
  Redis:
    Type: AWS::ElastiCache::ServerlessCache
    Properties:
      Engine: redis
      MajorEngineVersion: '7'
      ServerlessCacheName: !Sub '${ResourcePrefix}-limits'
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
      SecurityGroupIds: [!Ref CacheNetwork]
      UserGroupId: !Ref RedisUsers
      CacheUsageLimits:
        DataStorage: { Maximum: 2, Unit: GB }
        ECPUPerSecond: { Maximum: 5000 }

  Signup:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: marketplace-signup.handler
      Runtime: nodejs22.x
      Timeout: 5
      Environment:
        Variables:
          CAMPUS_EMAIL_DOMAIN: !Ref CampusEmailDomain
  StudentPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${ResourcePrefix}-students'
      UsernameAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      AutoVerifiedAttributes: [email]
      Schema:
        - { Name: email, Required: true, Mutable: true }
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
      LambdaConfig:
        PreSignUp: !GetAtt Signup.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
  SignupInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt Signup.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt StudentPool.Arn
  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref ResourcePrefix
      UserPoolId: !Ref StudentPool
  MemberResource:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref StudentPool
      Identifier: astrashop
      Name: AstraShop
      Scopes:
        - { ScopeName: marketplace, ScopeDescription: Use the campus marketplace }
  StudentClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: MemberResource
    Properties:
      UserPoolId: !Ref StudentPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      ReadAttributes: [email, email_verified]
      WriteAttributes: [email]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, astrashop/marketplace]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${FrontendOrigin}/']
      LogoutURLs: [!Sub '${FrontendOrigin}/']
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
  Moderators:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: MarketplaceModerators
      UserPoolId: !Ref StudentPool

  MarketplaceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [authorization, content-type]
        ExposeHeaders: [retry-after]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRate
        ThrottlingBurstLimit: !Ref ThrottleBurst
      AccessLogSettings:
        DestinationArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AccessLogs}
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency"}'
      Auth:
        DefaultAuthorizer: Student
        Authorizers:
          Student:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [astrashop/marketplace]
            JwtConfiguration:
              issuer: !GetAtt StudentPool.ProviderURL
              audience: [!Ref StudentClient]
  AccessLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30 }
  MarketplaceLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30 }
  PublicApi:
    Type: AWS::Serverless::Function
    DependsOn: [DynamoEndpoint, SignupInvoke]
    Properties:
      CodeUri: .
      Handler: src/marketplace-lambda.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 384
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref MarketplaceLogs
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaNetwork]
        SubnetIds: [!Ref PrivateA, !Ref PrivateB]
      Environment:
        Variables:
          MARKETPLACE_TABLE: !Ref MarketplaceTable
          REDIS_HOST: !GetAtt Redis.Endpoint.Address
          REDIS_PORT: !GetAtt Redis.Endpoint.Port
          REDIS_PASSWORD: !Sub '{{resolve:secretsmanager:${RedisSecret}:SecretString:password}}'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt MarketplaceTable.Arn
      Events:
        Browse: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: /marketplace/listings, Method: GET, Auth: { Authorizer: NONE } } }
        Publish: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: /marketplace/listings, Method: POST } }
        Mine: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: /marketplace/mine, Method: GET } }
        Edit: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}', Method: PUT } }
        Contact: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}/contact', Method: POST } }
        Report: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}/report', Method: POST } }
        Inbox: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: /marketplace/inbox, Method: GET } }
        Thread: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/threads/{id}', Method: GET } }
        Reply: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/threads/{id}', Method: POST } }
        Moderate: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}/moderate', Method: PUT } }
        Reports: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: /marketplace/reports, Method: GET } }
        ListingDetails: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}', Method: GET, Auth: { Authorizer: NONE } } }
        ListingComments: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}/comments', Method: GET, Auth: { Authorizer: NONE } } }
        AddListingComment: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}/comments', Method: POST } }
        RemoveListingComment: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/listings/{id}/comments/{commentId}', Method: PUT } }
        Sellers: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/sellers', Method: GET, Auth: { Authorizer: NONE } } }
        Seller: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/sellers/{id}', Method: GET, Auth: { Authorizer: NONE } } }
        SellerOffers: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/sellers/{id}/listings', Method: GET, Auth: { Authorizer: NONE } } }
        SellerReviews: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/sellers/{id}/reviews', Method: GET, Auth: { Authorizer: NONE } } }
        ReadProfile: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/profile', Method: GET } }
        WriteProfile: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/profile', Method: PUT } }
        Saved: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/saved', Method: GET } }
        IsSaved: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/saved/{id}', Method: GET } }
        ToggleSaved: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/saved/{id}', Method: PUT } }
        ExchangeStatus: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/threads/{id}/exchange', Method: GET } }
        ConfirmExchange: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/threads/{id}/exchange', Method: PUT } }
        ReviewExchange: { Type: HttpApi, Properties: { ApiId: !Ref MarketplaceApi, Path: '/marketplace/threads/{id}/review', Method: POST } }
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Marketplace API returned at least five server errors in five minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref MarketplaceApi }
        - { Name: Stage, Value: '$default' }
      Period: 300
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  MarketplaceApiUrl:
    Value: !Sub 'https://${MarketplaceApi}.execute-api.${AWS::Region}.amazonaws.com'
  CognitoLoginOrigin:
    Value: !Sub 'https://${ResourcePrefix}.auth.${AWS::Region}.amazoncognito.com'
  CognitoClientId:
    Value: !Ref StudentClient
  CognitoUserPoolId:
    Value: !Ref StudentPool
  MarketplaceTableName:
    Value: !Ref MarketplaceTable
