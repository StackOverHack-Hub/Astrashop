AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Astrashop - find, reserve and pick up items from campus shops

# One template per environment: deploy it as two stacks (e.g. astrashop-dev, astrashop-prod).
Parameters:
  ShopKey:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '^(|.{16,})$'
    ConstraintDescription: must be empty or at least 16 characters
    Description: Optional pilot counter key for the default shop only. Leave empty once its staff sign in with accounts.
  UserPoolId:
    Type: String
    AllowedPattern: '^[\w-]+_[0-9a-zA-Z]+$'
    Description: The StudentPool id from the marketplace stack. Students, staff and admins all sign in there.
  UserPoolClientId:
    Type: String
    AllowedPattern: '^[0-9a-z]+$'
    Description: The StudentClient id from the marketplace stack.
  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional webhook secret from the Razorpay dashboard. Empty turns POST /billing/razorpay off (501).
  DefaultShopId:
    Type: String
    Default: campus-shop
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
    Description: The shop that owns data from before shops existed, and the one the pilot routes and counter key open.
  AllowedOrigin:
    Type: String
    Default: '*'
    # One origin, scheme + host (+ port), no path or trailing slash; otherwise CORS silently fails.
    AllowedPattern: '^(\*|https?://[A-Za-z0-9.-]+(:[0-9]+)?)$'
    ConstraintDescription: must be * or an origin like https://main.d1234.amplifyapp.com (no trailing slash)
    Description: Frontend origin allowed by CORS, e.g. https://main.d1234.amplifyapp.com. Use * only until the frontend URL exists.
  HoldMinutes:
    Type: Number
    Default: 1440
    MinValue: 15
    MaxValue: 10080
    Description: Minutes a reservation stays set aside before it expires and the unit returns to the shelf.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email for alarm notifications (AWS sends a confirmation link first).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [authorization, content-type, x-shop-key]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        MaxAge: 600
      # Caps total traffic so a script can't run up the bill. Sized for about 50 shops at the start
      # of term; the per-student hold limit is what stops one person draining a shelf.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 400
        ThrottlingRateLimit: 200
      # Routes sign in by default. Public routes, and the pilot routes guarded by the counter key, opt out.
      Auth:
        DefaultAuthorizer: Campus
        Authorizers:
          Campus:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [astrashop/marketplace]
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience: [!Ref UserPoolClientId]
      AccessLogSettings:
        DestinationArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogs}
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","time":"$context.requestTime"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # Keys and indexes match backend/src/schema.mjs. CloudFormation adds one index per table per
  # deploy, so add any later index in its own deploy. Indexes project whole rows: the sweep needs them.
  ItemsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: shopId, AttributeType: S }
        - { AttributeName: name, AttributeType: S }
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: ByShop
          KeySchema: [{ AttributeName: shopId, KeyType: HASH }, { AttributeName: name, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  ReservationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: queueShop, AttributeType: S }
        - { AttributeName: expiresAt, AttributeType: S }
        - { AttributeName: shopId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
        - { AttributeName: studentId, AttributeType: S }
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      # queueShop exists only while a hold needs the counter, so Queue stays small.
      # ByShopCreated serves shop stats over a window of days, ByStudent a student's passes on any device.
      # Each was added in its own deploy: Queue, then ByShopCreated, then ByStudent.
      GlobalSecondaryIndexes:
        - IndexName: Queue
          KeySchema: [{ AttributeName: queueShop, KeyType: HASH }, { AttributeName: expiresAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: ByShopCreated
          KeySchema: [{ AttributeName: shopId, KeyType: HASH }, { AttributeName: createdAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: ByStudent
          KeySchema: [{ AttributeName: studentId, KeyType: HASH }, { AttributeName: createdAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Shops, staff, per-student hold counts and the staff audit log (expires after a year).
  TenancyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema: [{ AttributeName: pk, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }]
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Item photos: a private bucket that only CloudFront can read. Photo names come from their content,
  # so every file is cached for a year.
  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }

  PhotoOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-photos'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PhotoCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: photos
            DomainName: !GetAtt PhotoBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt PhotoOriginAccess.Id
        DefaultCacheBehavior:
          TargetOriginId: photos
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: CachingOptimized, and SecurityHeadersPolicy (nosniff, HSTS and more).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${PhotoBucket.Arn}/items/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PhotoCdn}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref FunctionLogs
      Environment:
        Variables:
          ITEMS_TABLE: !Ref ItemsTable
          RESERVATIONS_TABLE: !Ref ReservationsTable
          TENANCY_TABLE: !Ref TenancyTable
          SHOP_KEY: !Ref ShopKey
          DEFAULT_SHOP_ID: !Ref DefaultShopId
          HOLD_MINUTES: !Ref HoldMinutes
          RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
          PHOTO_BUCKET: !Ref PhotoBucket
          PHOTO_BASE_URL: !Sub 'https://${PhotoCdn.DomainName}'
      # Only the actions the code uses; transactions authorize as their parts.
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem, dynamodb:Scan, dynamodb:Query]
              Resource:
                - !GetAtt ItemsTable.Arn
                - !GetAtt ReservationsTable.Arn
                - !GetAtt TenancyTable.Arn
                - !Sub '${ItemsTable.Arn}/index/*'
                - !Sub '${ReservationsTable.Arn}/index/*'
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${PhotoBucket.Arn}/items/*'
      Events:
        # Open to anyone: browsing, and a pickup pass read by its secret reservation id.
        ListItems: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /items, Method: GET, Auth: { Authorizer: NONE } } }
        ShopItems: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/items', Method: GET, Auth: { Authorizer: NONE } } }
        Shops: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /shops, Method: GET, Auth: { Authorizer: NONE } } }
        # Signed by Razorpay with the webhook secret; checked inside the function.
        Billing: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /billing/razorpay, Method: POST, Auth: { Authorizer: NONE } } }
        GetReservation: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/reservations/{id}', Method: GET, Auth: { Authorizer: NONE } } }
        # Signed in; the function checks the shop role for each request.
        Me: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /me, Method: GET } }
        MyPasses: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /me/reservations, Method: GET } }
        Photo: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/items/{id}/photo', Method: PUT } }
        Reserve: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /reservations, Method: POST } }
        Queue: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/reservations', Method: GET } }
        Stats: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/stats', Method: GET } }
        Stock: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/items/{id}', Method: PUT } }
        Collect: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/reservations/{id}/collect', Method: POST } }
        Release: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/reservations/{id}/release', Method: POST } }
        Returned: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/reservations/{id}/returned', Method: POST } }
        SetAside: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/reservations/{id}/set-aside', Method: POST } }
        Staff: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/staff/{userId}', Method: PUT } }
        CreateShop: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /admin/shops, Method: POST } }
        ListShops: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /admin/shops, Method: GET } }
        ShopStatus: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/admin/shops/{shopId}', Method: PUT } }
        ShopSettings: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}', Method: PUT } }
        Catalog: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/catalog', Method: GET } }
        CreateItem: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/items', Method: POST } }
        EditItem: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/items/{id}/details', Method: PUT } }
        StaffList: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/staff', Method: GET } }
        Invite: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/invites', Method: POST } }
        AcceptInvite: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /invites/accept, Method: POST } }
        Activity: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shops/{shopId}/audit', Method: GET } }
        # Pilot routes for the default shop, guarded by the counter key inside the function.
        ShopHeld: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /shop/reservations, Method: GET, Auth: { Authorizer: NONE } } }
        ShopStock: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shop/items/{id}', Method: PUT, Auth: { Authorizer: NONE } } }
        ShopCollect: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shop/reservations/{id}/collect', Method: POST, Auth: { Authorizer: NONE } } }
        ShopRelease: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shop/reservations/{id}/release', Method: POST, Auth: { Authorizer: NONE } } }
        ShopReturned: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shop/reservations/{id}/returned', Method: POST, Auth: { Authorizer: NONE } } }
        ShopSetAside: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/shop/reservations/{id}/set-aside', Method: POST, Auth: { Authorizer: NONE } } }
        ShopStats: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /shop/stats, Method: GET, Auth: { Authorizer: NONE } } }
        ExpireHolds: { Type: Schedule, Properties: { Schedule: rate(10 minutes) } }

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  # The handler turns caught errors into 500/503 responses, so watch the API's 5xx count.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Astrashop API returned 5 or more server errors in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref Api }
        - { Name: Stage, Value: '$default' }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # Crashes and timeouts, including the scheduled hold expiry.
  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Astrashop Lambda crashed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # The expiry sweep publishes SweepRun every 10 minutes. No runs for 30 minutes means holds stop
  # expiring and stock stays locked up, even though nothing is "erroring".
  SweepHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The hold expiry sweep has not run for 30 minutes
      Namespace: Astrashop
      MetricName: SweepRun
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # A pickup finished without a hold count to give back: counts and holds disagree (after a restore?).
  HoldCountMismatchFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogs
      FilterPattern: '"hold_count_mismatch"'
      MetricTransformations: [{ MetricNamespace: Astrashop, MetricName: HoldCountMismatch, MetricValue: '1', DefaultValue: 0 }]

  HoldCountMismatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hold counts disagree with holds; check the tenancy table against reservations
      Namespace: Astrashop
      MetricName: HoldCountMismatch
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # Someone is posting forged billing webhooks, or the Razorpay secret was rotated on one side only.
  BillingSignatureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogs
      FilterPattern: '"billing_signature_rejected"'
      MetricTransformations: [{ MetricNamespace: Astrashop, MetricName: BillingSignatureRejected, MetricValue: '1', DefaultValue: 0 }]

  BillingSignatureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Billing webhooks with a bad signature; check the Razorpay webhook secret on both sides
      Namespace: Astrashop
      MetricName: BillingSignatureRejected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

Outputs:
  BillingWebhookUrl:
    Description: Paste into Razorpay as the webhook URL, with the same secret as RazorpayWebhookSecret.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/billing/razorpay
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  ItemsTableName:
    Value: !Ref ItemsTable
  ReservationsTableName:
    Value: !Ref ReservationsTable
  TenancyTableName:
    Value: !Ref TenancyTable
  PhotoBucketName:
    Value: !Ref PhotoBucket
  PhotoBaseUrl:
    Description: Add this origin to img-src in the Amplify Content-Security-Policy.
    Value: !Sub 'https://${PhotoCdn.DomainName}'
