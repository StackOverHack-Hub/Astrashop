# Paste into Amplify console → Hosting → Custom headers, after replacing API_ORIGIN
# with your ApiUrl from `sam deploy`, e.g. https://abc123.execute-api.ap-south-1.amazonaws.com
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' API_ORIGIN; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'index.html'
    headers:
      - key: Cache-Control
        value: no-cache
